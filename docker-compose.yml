services:
  backend:
    build: ./backend
    env_file: [.env.example]        # copy to .env and edit if you want overrides
    environment:
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    depends_on:
      backend: { condition: service_healthy }
    ports: ["8080:80"]               # nginx proxies /api to http://backend:8000
